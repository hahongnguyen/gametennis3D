<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ba Con Dê Tennis Team – Giao hữu 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--court:#0C3B3A;--deep:#06201F;--card:#0F4A45;--line:#F2FFF6;--clay:#1FBF5B;--ball:#C6F432;--mut:#9CC9BB;--up:#9BF07A;--dn:#FF8A7A;
--hd:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--tx:'Barlow',Arial,sans-serif}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:500 15px/1.45 var(--tx);color:var(--line);background:radial-gradient(circle at 100% 0,#11584F 0,transparent 45%),var(--deep);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--court) 0 64%,var(--deep) 64%);border-bottom:4px solid var(--ball);padding:14px 16px;display:flex;gap:14px;align-items:center}header::after{content:'';position:absolute;right:-26px;top:-10px;width:110px;height:150%;background:var(--ball);opacity:.14;transform:skewX(-24deg);pointer-events:none}header>*{position:relative;z-index:1}
header h1{font:800 27px/1.02 var(--hd);letter-spacing:.6px;text-transform:uppercase;color:#fff}header h1 b{display:block;color:var(--ball);font-size:20px;letter-spacing:3px}header p{color:var(--mut);font-size:13px;margin-top:3px}
.logo{width:84px;height:auto;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--court);border-top:3px solid var(--ball);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 14px var(--hd);padding:13px 2px;letter-spacing:.2px}
nav button.on{color:var(--deep);background:var(--ball)}
main{max-width:860px;margin:0 auto;padding:14px}
h2{font:800 24px var(--hd);margin:6px 0 10px}h3{font:700 18px var(--hd);margin:14px 0 6px;color:var(--ball)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);padding:10px;border-left:4px solid var(--clay)}.stat b{display:block;font:800 28px var(--hd)}.stat span{color:var(--mut);font-size:12px}
.tools{display:flex;gap:8px;margin-bottom:10px}
input,select{width:100%;background:var(--deep);color:var(--line);border:1.5px solid #2E7D6B;border-radius:4px;padding:10px;font:500 16px var(--tx)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.pc{background:var(--card);padding:10px 6px;text-align:center;cursor:pointer;border-top:4px solid var(--mut)}.pc.r1{border-color:var(--ball);padding-bottom:18px}
.pc i{font:800 20px var(--hd);font-style:normal;color:var(--ball)}.pc b{display:block;font:700 16px var(--hd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc em{font:800 28px var(--hd);font-style:normal}.pc small{display:block;color:var(--ball);font:700 17px var(--hd)}
.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;background:var(--card);padding:10px;margin-bottom:5px;cursor:pointer;border-left:4px solid transparent}
.row{transition:transform .15s,border-color .15s}.row:hover,.row:active{border-color:var(--ball);transform:translateX(4px)}.rk{font:800 20px var(--hd);color:var(--mut);text-align:center}.nm{font:700 18px var(--hd)}.sub{font-size:12px;color:var(--mut)}
.sc{text-align:center;min-width:56px}.sc b{display:block;font:800 26px/1 var(--hd)}.sc small{display:block;font-size:12px;color:var(--mut);margin-top:2px}.sc.d b{color:var(--ball)}.tr{font:700 12px var(--tx)}.up{color:var(--up)}.dn{color:var(--dn)}
.chip{display:inline-block;font:700 11px var(--tx);background:var(--ball);color:var(--deep);padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:middle}
.m{background:var(--card);padding:12px;margin-bottom:8px;border-left:4px solid var(--ball)}.m.no{border-color:var(--mut);opacity:.85}
.mh{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.vs div{font:700 17px var(--hd)}.vs div:last-child{text-align:right}.vs .w{color:var(--ball)}.vs span{font:800 22px var(--hd);background:var(--deep);padding:2px 10px}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:8px}.chg span{display:block;background:var(--deep);padding:6px 8px;border-radius:3px;font-size:14px}.chg small{display:block;color:var(--mut);font-size:11px}.mh{flex-wrap:wrap;gap:4px;align-items:center}.bd{font:700 11px var(--tx);font-style:normal;background:var(--deep);color:var(--mut);padding:2px 7px;border-radius:3px}.bd.no{background:#F2B84B;color:#06201F}.sb{margin:8px 0}.tm{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--deep);margin-bottom:3px;border-left:4px solid transparent}.tm.w{border-color:var(--ball)}.tm .tag{font:800 12px var(--hd);background:var(--card);color:var(--mut);padding:1px 6px}.tm .n{flex:1;min-width:0;font:700 18px/1.15 var(--hd)}.tm .s{font:800 26px/1 var(--hd);min-width:26px;text-align:center}.tm.w .n,.tm.w .s{color:var(--ball)}
.box{background:var(--card);padding:14px;margin-bottom:10px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}button.b{background:var(--clay);color:var(--deep);border:0;border-radius:4px;padding:12px 16px;font:800 17px var(--hd);letter-spacing:.5px;width:100%;margin-top:10px}
button.b.s{background:transparent;border:2px solid var(--ball);color:var(--ball)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border:2px solid var(--clay);background:none;color:var(--line);font:700 16px var(--hd)}#gw{position:relative;height:min(74vh,660px);min-height:400px;background:#06201F;border-bottom:3px solid var(--ball);overflow:hidden}#gc3{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;left:8px;right:8px;top:8px;pointer-events:none;text-shadow:0 1px 3px #000}.hb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(6,32,31,.78);padding:6px 12px;font:800 20px var(--hd)}.hb em{font-style:normal;color:var(--ball)}.hm{margin-top:4px;font:600 14px var(--tx)}#gm{position:absolute;inset:0;background:rgba(6,32,31,.9);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#gm .b{margin:6px auto;max-width:260px}#gs{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:auto;padding:12px 30px}.tabs.sm button{padding:6px;font-size:14px}.ch text{fill:var(--mut);font:9px var(--tx)}.ch{display:block;width:100%;max-width:420px;margin:8px auto}.gc summary{cursor:pointer;font:700 17px var(--hd);list-style:none}.gc summary::-webkit-details-marker{display:none}.gc summary::after{content:' ▾';color:var(--ball)}.gc[open] summary::after{content:' ▴'}.bars{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:8px;max-width:420px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}.bc i{display:block;width:100%;max-width:30px;background:linear-gradient(var(--ball),var(--clay));border-radius:4px 4px 0 0}.bc span{font:700 12px var(--tx);margin-bottom:2px}.bc em{font:500 10px var(--tx);font-style:normal;color:var(--mut);margin-top:4px}.tabs .on{background:var(--clay);color:var(--deep)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid #2E7D6B;text-align:left}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ball);color:var(--deep);padding:12px;font-weight:600;z-index:9;display:none}.toast.err{background:var(--dn)}
.sheet{position:fixed;inset:0;background:rgba(2,16,15,.82);z-index:8;display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet>div{background:var(--court);width:100%;max-width:860px;margin:0 auto;max-height:86vh;overflow:auto;padding:16px;border-top:4px solid var(--ball)}
.how p,.how li{margin-bottom:6px}.how code{background:var(--deep);padding:2px 6px;display:inline-block}
@media(min-width:700px){nav{position:static;border:0;max-width:860px;margin:0 auto}nav button{font-size:18px}body{padding-bottom:20px}}
@media(prefers-reduced-motion:no-preference){.sheet>div{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px)}}}
</style></head><body>

  if(g.keys.l)g.tx-=7*dt;if(g.keys.r)g.tx+=7*dt;g.tx=cp(g.tx,-4.8,4.8);
  const nx=g.px+cp(g.tx-g.px,-8*dt,8*dt);g.vx+=((nx-g.px)/dt-g.vx)*.3;g.px=nx;
  g.pz+=cp((g.hitter=='c'&&b.p.z>0?cp(b.p.z+.4,6,12.3):11.8)-g.pz,-6*dt,6*dt);
  if(g.live&&g.hitter=='p'){const t=Math.max(0,(-10.5-b.p.z)/(b.v.z||-1));g.ctx=cp(b.p.x+b.v.x*t*.85+g.aiErr,-4.6,4.6)}else if(!g.live)g.ctx=0;
  g.cx+=cp(g.ctx-g.cx,-sp*dt,sp*dt);g.cz+=cp((g.hitter=='p'&&b.p.z<0?cp(b.p.z-.4,-12.3,-6):-11.8)-g.cz,-6*dt,6*dt);if(g.sw>0)g.sw-=dt;
  if(!g.live){if(!g.over){if(g.wait>0)g.wait-=dt;else if(g.srv=='c'){g.msg='';serve('c');hud()}}return}
  const o=b.p.clone();b.v.y-=9.8*dt;b.p.addScaledVector(b.v,dt);const loser=g.hitter=='p'?'c':'p';
  if(o.z*b.p.z<=0&&b.p.y<.95)return pt(loser,'Bóng chạm lưới.');
  if(b.p.y<=.11&&b.v.y<0){b.p.y=.11;const side=g.hitter=='p'?-1:1,ok=Math.abs(b.p.x)<=4.115&&Math.abs(b.p.z)<=11.885&&b.p.z*side>0&&(!g.serving||Math.abs(b.p.z)<=6.4);
   if(!ok)return pt(loser,g.serving?'Giao bóng lỗi.':'Bóng ra ngoài.');g.bn++;g.serving=false;if(g.bn>=2)return pt(g.hitter,'Bóng nảy hai lần.');b.v.y*=-.72;b.v.x*=.85;b.v.z*=.85}
  if(Math.abs(b.p.z)>15||Math.abs(b.p.x)>9)return g.bn?pt(g.hitter,'Cú đánh đẹp.'):pt(loser,'Bóng ra ngoài.');
  if(g.hitter!='p'&&g.bn==1&&b.p.z>1&&b.v.z>0&&b.p.y<2.5&&Math.hypot(b.p.x-g.px,b.p.z-g.pz)<1.4)hit('p');
  else if(g.hitter!='c'&&g.bn==1&&b.p.z<-1&&b.v.z<0&&b.p.y<2.5&&Math.hypot(b.p.x-g.cx,b.p.z-g.cz)<1.4+[0,.15,.3][g.lvl])hit('c')};
 const rs=()=>{const W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;r.setSize(W,H,false);cam.aspect=W/H;cam.fov=W/H<1?62:48;cam.updateProjectionMatrix()};
 const draw3=()=>{me.position.set(g.px,0,g.pz);ai.position.set(g.cx,0,g.cz);me.ra.rotation.y=Math.max(0,g.sw)/.25*1.6;ai.ra.rotation.y=Math.max(0,g.sw)/.25*-1.6*(g.hitter=='c'?1:0);
  const s=g.srv=='p';ball.position.copy(g.live?g.ball.p:new T.Vector3(s?g.px:g.cx,1.2,s?g.pz:g.cz));sh.position.set(ball.position.x,.02,ball.position.z);sh.scale.setScalar(1/(1+ball.position.y*.2));
  cam.position.x+=(g.px*.3-cam.position.x)*.06;cam.position.set(cam.position.x,6.4,18.2);cam.lookAt(0,.4,-3);
  $('#gs').style.display=!g.live&&!g.over&&g.run&&g.srv=='p'&&g.wait<=0?'block':'none'};
 g.serveBtn=()=>{if(!g.live&&!g.over&&g.run&&g.srv=='p'&&g.wait<=0){g.msg='';serve('p');hud()}};
 g.start=l=>{Object.assign(g,{lvl:l,gm:[0,0],pts:[0,0],srv:'p',over:false,live:false,hitter:'',wait:.6,msg:'Đến lượt bạn giao bóng',run:true});$('#gm').style.display='none';hud()};
 g.kd=e=>{if(S.tab!='game')return;const k=e.code;if(k=='ArrowLeft'||k=='KeyA'){g.keys.l=1;e.preventDefault()}if(k=='ArrowRight'||k=='KeyD'){g.keys.r=1;e.preventDefault()}if(k=='Space'){e.preventDefault();g.serveBtn()}};
 g.ku=e=>{const k=e.code;if(k=='ArrowLeft'||k=='KeyA')g.keys.l=0;if(k=='ArrowRight'||k=='KeyD')g.keys.r=0};
 g.rs=rs;addEventListener('keydown',g.kd);addEventListener('keyup',g.ku);addEventListener('resize',rs);

 const loop=t=>{g.raf=requestAnimationFrame(loop);const dt=Math.min(.033,(t-g.last)/1000||.016);g.last=t;if(g.run)step(dt);draw3();r.render(sc,cam)};
